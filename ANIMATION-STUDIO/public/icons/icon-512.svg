<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGlow)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Studio Emblem (Canvas Layer + Vector Pen Tip) -->
  <g filter="url(#shadow)">
    <!-- Stylized Frame / Canvas -->
    <rect x="96" y="96" width="320" height="320" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="4" />
    
    <!-- Dynamic Color Wave Swirl -->
    <path d="M 120 340 C 180 260, 240 380, 320 280 C 360 230, 392 240, 400 200" fill="none" stroke="url(#primaryGlow)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Stylus Pen Nib -->
    <path d="M 330 140 L 390 200 L 260 330 L 210 335 L 215 285 Z" fill="url(#primaryGlow)" />
    <polygon points="210,335 240,310 235,330" fill="#ffffff" />
    <circle cx="215" cy="330" r="4" fill="#020617" />
  </g>

  <!-- 8K Pro Badge -->
  <rect x="290" y="370" width="136" height="52" rx="16" fill="url(#amberGold)" />
  <text x="358" y="406" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#000000" text-anchor="middle" letter-spacing="1">8K PRO</text>

  <!-- Sparkle Stars -->
  <path d="M 150 160 L 155 175 L 170 180 L 155 185 L 150 200 L 145 185 L 130 180 L 145 175 Z" fill="#38bdf8" />
  <path d="M 360 120 L 363 130 L 373 133 L 363 136 L 360 146 L 357 136 L 347 133 L 357 130 Z" fill="#fbbf24" />
</svg>
